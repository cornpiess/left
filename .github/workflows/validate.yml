name: Validate app
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  startup-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx expo export --platform ios
